####################################
# Romglb ocean, P_O opened system burial + restoring_P, const atm.O2
# const. P weathering is replaced by restoring_P
# Change the biopump function to Martin's
# add oceanhlatgyresurface domain
####################################
model_BioProdPrest_Martin_Ozaki2011:
    parameters:
        CIsotope: ScalarData
        SIsotope: ScalarData
        P_restore: 3.466e15
        O2_atm_restore: 3.7e19
        O2_ocean_restore: 3.22e17
        constant_O: false
        
    domains:
     
        fluxAtmtoOceansurface:            
            reactions:
                fluxtarget:
                    class: ReactionFluxTarget
                    parameters:
                        flux_totals: true
                        fluxlist: ["O2", "CO2::CIsotope"]

        fluxRtoOcean:
            
            reactions:
                transfer:
                    class: ReactionFluxTarget
                    parameters:
                        fluxlist: ["P", "TAlk", "SO4::SIsotope", "O2"]  # for restoring fluxes

        fluxOceanfloor:
            reactions:
                particulatetarget:
                    class: ReactionFluxTarget
                    parameters:
                        flux_totals: true
                        target_prefix: particulateflux_
                        fluxlist: ["Corg::CIsotope", "N", "P", "Ccarb::CIsotope"]
                    
                solutetarget:
                    class: ReactionFluxTarget
                    parameters:
                        flux_totals: true
                        target_prefix: soluteflux_
                        fluxlist: ["DIC::CIsotope", "TAlk", "O2", "P", "SO4::SIsotope", "H2S::SIsotope"]
        

        fluxOceanBurial:
            reactions:
                transfer:
                    class: ReactionFluxTarget
                    parameters:
                        flux_totals: true
                        fluxlist: ["Corg::CIsotope", "Ccarb::CIsotope", "GYP::SIsotope", "PYR::SIsotope", "P", "Pauth", "PFe", "Porg"]
                
        global:
            # scalar domain
            
            reactions:
                total_O2:
                    class: ReactionSum
                    parameters:
                        vars_to_add: [atm.O2, ocean.O2]
                    variable_links:
                        sum: total_O2     

        land:
            reactions:
                P_weathering: 
                    class: ReactionFluxPerturb
                    parameters:
                        perturb_times: [-1e30, 1e30]
                        perturb_totals: [0.0, 0.0]   # mol P yr-1                    
                    variable_links:
                        F: fluxRtoOcean.flux_P
                        FApplied: P_weath
                        tforce: global.tforce

        atm:
            reactions:
                reservoir_O2:
                    class: ReactionReservoirAtm
                    parameters:
                        const: external%constant_O
                    variable_links:
                        R*: O2
                        pRatm: pO2atm
                        pRnorm: pO2PAL
                    variable_attributes:
                        R:norm_value:           3.7e19  # present-day atmospheric level
                        R:initial_value:        3.7e19                
                
                restoreO2:
                    class: ReactionRestore
                    parameters:
                        RequiredLevel:  external%O2_atm_restore # 3.7e19  # PAL
                        trestore:       1000.0
                        source_only:    false
                    variable_links:
                        WatchLevel:  O2
                        RestoringFlux: O2_sms
                        RestoringApplied: O2_restoring

                transfer_AtmtoOceansurface:
                    class: ReactionFluxTransfer
                    parameters:
                        transfer_matrix:      Distribute
                        transfer_multiplier:  -1.0  
                        input_fluxes:         fluxAtmtoOceansurface.flux_$fluxname$
                        output_fluxes:        $fluxname$_sms      

        ocean:
            reactions:
                transportromglb:
                    <<: *oceantransport

                reservoir_O2:
                    class: ReactionReservoirTotal               
                    variable_links:
                        R*: O2
                    variable_attributes:                      
                        R:initial_value:        0.2054  # concentration m-3 (1027 kg m-3 * 200e-6 mol/kg-sw)
                        R:norm_value:           0.2054

                reservoir_P:
                    class: ReactionReservoirTotal               
                    variable_links:
                        R*: P
                    variable_attributes:                      
                        R:initial_value:        2.208e-3  # concentration m-3 (1027 kg m-3 * 2.15e-6 mol/kg-sw)                
                        R:norm_value:           2.208e-3

                light:
                    class: ReactionLightColumn
                    parameters:
                        background_opacity: 0.0  # zero opacity as we just want to prescribe insolation in surface boxes
                
                bioprod:
                    <<: *oceanbioprod

                biopumpCorg:
                    class: ReactionExportDirectColumn

                    parameters:
                        fluxlist:           ["P", "N", "Corg::CIsotope"]
                        transportfloor:     true 
                        exportfunction:     Martin
                        input_frac:         [1.0]    # Martin power law has single component
                        martin_rovera:      0.858    # Martin power law exponent: flux \\propto depth^rovera")
                        martin_depthmin:    100.0    # depth at which power law starts


                reminocean:
                    class: ReactionReminO2

                    parameters:                        

                    variable_links:
                        soluteflux_*:   "*_sms"

                restoreP:
                    class: ReactionRestore

                    parameters:
                        RequiredLevel: external%P_restore  # mol 1.570e18 m^3 * 2.208e-3 mol m-3
                        trestore:      100.0
                        source_only:   true
                    variable_links:
                        WatchLevel:  P_total
                        RestoringFlux: fluxRtoOcean.flux_P       

                # restore_ocean_O2:
                #     class: ReactionRestore

                #     parameters:
                #         RequiredLevel: external%O2_ocean_restore  # mol 1.570e18 m^3 * 0.2054 mol m-3
                #         trestore:      1000.0
                #         source_only:   true
                #     variable_links:
                #         WatchLevel:  ocean.O2_total
                #         RestoringFlux: fluxRtoOcean.flux_O2                           
               
        oceansurface:
            reactions:
                airsea_O2:
                    class: ReactionAirSeaO2
                    parameters:
                        piston: 4.8 # m d-1

                surface_insol:
                    <<: *surfaceinsol

                transfer_fluxAtmtoOceansurface:
                    class: ReactionFluxTransfer
                    parameters:
                        transfer_matrix:      Identity
                        input_fluxes:         fluxAtmtoOceansurface.flux_$fluxname$
                        output_fluxes:        ocean.oceansurface.$fluxname$_sms                       
                    variable_links:                        
                        # output_CO2:           ocean.oceansurface.DIC_sms

        oceanhlatgyresurface:
            reactions:
                transfer_RtoOcean:
                    class: ReactionFluxTransfer
                    parameters:
                        transfer_matrix:        Distribute
                        input_fluxes:         fluxRtoOcean.flux_$fluxname$
                        output_fluxes:        ocean.oceanhlatgyresurface.$fluxname$_sms

        oceanfloor:               
            reactions:
                sedrate:
                    class: ReactionSedimentationRate
                    parameters:
                        sed_rate_function: Tromp1995

                sedBEcorgP:
                    class: ReactionBurialEffCorgP
                    parameters:                       
                        burial_eff_function: Ozaki2011

                        # overall normalization for Corg burial to give 2.5e12 mol C yr-1
                        BECorgNorm:   0.124  # 2.5e12/17.22e12
                        
                        # P:Corg burial ratios to give 4e+10 mol P yr-1
                        BPO2:          [1.0]           # 2mg/l O2 = 0.0625 mol/m3
                        BPorgCorg:     [4.0e-3]    # prescribed P:Corg
                        BPFeCorg:      [4.0e-3]    # prescribed P:Corg
                        BPauthCorg:    [8.0e-3]    # prescribed P:Corg

                    variable_links:
                        reminflux_Corg: remin_Corg # -> reminoceanfloor
                        reminflux_N:    remin_N    # -> reminoceanfloor
                        reminflux_P:    remin_P    # -> reminoceanfloor
       
                reminoceanfloor:
                    class: ReactionReminO2

                    parameters:
                                
                    variable_links:
                        #remin*:           particulateflux*
                        # remin_Corg:       particulateflux_Corg
                        # remin_P:            particulateflux_P
                        # remin_P:            particulateflux_P

                        soluteflux_*:     fluxOceanfloor.soluteflux_*   #_P, _O2
                        # remin_Ccarb:        particulateflux_Ccarb  # no burial Reaction, so remin everything                   

                transferparticulate_fluxOceanfloor:
                    class: ReactionFluxTransfer
                    parameters:
                        transfer_matrix:      Identity
                        input_fluxes:         fluxOceanfloor.particulateflux_$fluxname$
                        output_fluxes:        particulateflux_$fluxname$

                transfersolute_fluxOceanfloor:
                    class: ReactionFluxTransfer
                    parameters:
                        transfer_matrix:      Identity
                        input_fluxes:         fluxOceanfloor.soluteflux_$fluxname$
                        output_fluxes:        ocean.oceanfloor.$fluxname$_sms
       
        sedcrust:
