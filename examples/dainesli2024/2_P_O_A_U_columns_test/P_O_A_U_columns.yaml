                target:
                    class: ReactionFluxTarget
                    parameters:
                        fluxlist: ["Ccarb::CIsotope", "Corg::CIsotope", "GYP::SIsotope", "PYR::SIsotope"] 

        fluxOceanfloor:
            reactions:
                solutetarget:
