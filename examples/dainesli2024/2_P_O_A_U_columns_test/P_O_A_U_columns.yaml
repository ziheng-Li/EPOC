                        input_fluxes:         fluxLandtoSedCrust.flux_$fluxname$
                        output_fluxes:        $fluxname$_sms
                    variable_links:
                        output_Corg:            G_sms            # fix naming Corg = G                        
                        output_Ccarb:           C_sms            # fix naming Ccarb = C
                        #output_Sr:              Sr_sed_sms            # fix naming


        ocean:
