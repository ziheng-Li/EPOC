                        target_prefix: soluteflux_
                        fluxlist: ["U::UIsotope"]
                
                        
        global:
            # scalar domain
            
            reactions:

                const_copseforcings:
                    class: ReactionScalarConst
                    parameters:
                        constnames: ["tforce_constant", "UPLIFT", "W", "VEG", "CPland_relative", "PG", "RHO", "RHOSIL", "F_EPSILON", "DEGASS", "Bforcing"] #  
                    variable_attributes:
                        tforce_constant:initial_value:  -600e6 # -1000e6  # set to preCambrian     
                        UPLIFT:initial_value:           1.0  # COPSE uplift forcing
                        W:initial_value:                0.0  # COPSE biotic enhancement of land weathering
                        CPland_relative:initial_value:  1.0  # COPSE land Corg enhancement factor
                        PG:initial_value:               1.0  # COPSE paleogeographic forcing factor
                        RHO:initial_value:              1.0
