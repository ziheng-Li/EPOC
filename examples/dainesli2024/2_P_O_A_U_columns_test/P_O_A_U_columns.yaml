                    class: ReactionReservoirScalar
                   
                    variable_links:
                        R*: P*
                    variable_attributes:
                        R:norm_value:           3.1e15
                        R:initial_value:        3.1e15
                
                reservoir_U:
                    class: ReactionReservoirScalar
                    parameters:
                        field_data: external%UIsotope
                    
                    variable_links:
                        R*: U*
                    variable_attributes:
                        R:norm_value:           1.9e13
                        R:initial_value:        1.9e13
                        R:initial_delta:        -0.36  # per mil
                
                
                oceanburial_columns:
                    class: ReactionOceanBurialColumn
                    parameters:
                        ncols: 100  # number of ocean columns
                        k_mocb: 4.5e12      
                        corg_burial_fac: 1.0 # multiplier for marine organic carbon burial rate (and C:P burial ratio)
                       
                        k_anox: 1000.0 # anoxia function sharpness
                        k_oxic: 115.4 # local C:P burial ratio oxic
                        k_anoxic: 461.6  # local C:P burial ratio anoxic
                        k_O2_U_min: 0.49 # minimum normalized O2 utilisation
                        k_O2_U_max: 0.51 # maximum normalized O2 utilisation"), 
                        anoxic_threshold: 0.975
                    
                    # Ziheng missed to link DIS_sms -= local_Corgburial !
                    # Link DIC_sms to A_sms, then A_sms -= local_Corgburial
                    variable_links: 
                        DIC_sms: atmocean.A_sms   

        oceansurface:
